<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffdefb;
      padding: 30px;
      max-width: 700px;
      margin: auto;
    }

    h1, h2 {
      color: #333;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      font-size: 14px;
    }

    button {
      background: rgb(249, 177, 245);
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #d6d6d6;
    }

    .box {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 5px;
    }

    .product {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }

    .admin {
      display: none;
    }
  </style>
</head>
<body>

<h1>Store</h1>

<div class="box">
  <h2>Register</h2>
  <input id="regEmail" placeholder="Email">
  <input id="regPassword" type="password" placeholder="Password">

  <label>
    <input type="radio" name="role" value="user" checked> User
  </label>
  <label>
    <input type="radio" name="role" value="admin"> Admin
  </label>

  <button onclick="register()">Register</button>
</div>

<div class="box">
  <h2>Login</h2>
  <input id="loginEmail" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div class="box admin">
  <h2>Add product (Admin)</h2>
  <input id="name" placeholder="Name">
  <input id="price" type="number" placeholder="Price">
  <input id="category" placeholder="Category ID">
  <input id="description" placeholder="Description">
  <button onclick="addProduct()">Add</button>
</div>

<div class="box">
  <h2>Products</h2>
  <div id="products"></div>
</div>

<script>
const API_AUTH = '/api/auth';
const API_PRODUCTS = '/api/products';
const API_REVIEWS = '/api/reviews';

function getToken() {
  return localStorage.getItem('token');
}

function isAdmin() {
  const token = getToken();
  if (!token) return false;
  const payload = JSON.parse(atob(token.split('.')[1]));
  return payload.role === 'admin';
}

function showAdmin() {
  document.querySelectorAll('.admin').forEach(el => {
    el.style.display = isAdmin() ? 'block' : 'none';
  });
}


async function register() {
  const role = document.querySelector('input[name="role"]:checked').value;

  const res = await fetch(`${API_AUTH}/register`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: regEmail.value,
      password: regPassword.value,
      role
    })
  });

  const data = await res.json();

  if (res.ok) {
    localStorage.setItem('token', data.token);
    alert('You registered successfully');
    showAdmin();
    loadProducts();
  } else {
    alert(data.message);
  }
}

async function login() {
  const res = await fetch(`${API_AUTH}/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: loginEmail.value,
      password: loginPassword.value
    })
  });

  const data = await res.json();

  if (res.ok) {
    localStorage.setItem('token', data.token);
    alert('Login successful');
    showAdmin();
    loadProducts();
  } else {
    alert(data.message);
  }
}


async function loadProducts() {
  const res = await fetch(API_PRODUCTS);
  const products = await res.json();

  productsDiv = document.getElementById('products');
  productsDiv.innerHTML = '';

  products.forEach(p => {
    const div = document.createElement('div');
    div.className = 'product';

    div.innerHTML = `
      <b>${p.name}</b><br>
      ${p.description}<br>
      💲${p.price}<br><br>

      <input id="rate-${p._id}" type="number" min="1" max="5" placeholder="Rating">
      <input id="comm-${p._id}" placeholder="Comment">
      <button onclick="addReview('${p._id}')">Add review</button>

      <div id="reviews-${p._id}"></div>
      ${isAdmin() ? `<button onclick="deleteProduct('${p._id}')">Delete</button>` : ''}
    `;

    productsDiv.appendChild(div);
    loadReviews(p._id);
  });
}

async function addProduct() {
  const token = localStorage.getItem('token');
  if (!token) {
    alert('No token found — please login again');
    return;
  }

  if (!isAdmin) {
    alert('Only admin can add products');
    return;
  }

  const payload = {
    name: document.getElementById('name').value.trim(),
    price: Number(document.getElementById('price').value),
    category: document.getElementById('category').value.trim(),
    description: document.getElementById('description').value.trim()
  };

  console.log('Sending product:', payload);           // ← see in console
  console.log('Using token:', token.substring(0,20) + '...');

  try {
    const res = await fetch('/api/products', {       
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });

    console.log('Status:', res.status);             

    if (!res.ok) {
      const errorText = await res.text();
      console.log('Error response:', errorText);
      alert(`Failed: ${res.status} — ${errorText}`);
      return;
    }

    alert('Product added!');
    loadProducts();
  } catch (err) {
    console.error('Fetch error:', err);
    alert('Network error — check console');
  }
}

async function deleteProduct(id) {
  await fetch(`${API_PRODUCTS}/${id}`, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + getToken() }
  });
  loadProducts();
}


async function loadReviews(id) {
  const res = await fetch(`${API_REVIEWS}/${id}`);
  const reviews = await res.json();

  const div = document.getElementById(`reviews-${id}`);
  div.innerHTML = '<small>Reviews:</small>';

  reviews.forEach(r => {
    div.innerHTML += `<div>⭐ ${r.rating} - ${r.comment || ''}</div>`;
  });
}

async function addReview(id) {
  await fetch(`${API_REVIEWS}/${id}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + getToken()
    },
    body: JSON.stringify({
      rating: document.getElementById(`rate-${id}`).value,
      comment: document.getElementById(`comm-${id}`).value
    })
  });
  loadReviews(id);
}

showAdmin();
loadProducts();
</script>

</body>
</html>
